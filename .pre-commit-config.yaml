repos:
  - repo: local
    hooks:
      - id: biome-check
        name: Biome Check
        entry: pnpm exec biome check --files-ignore-unknown=true
        language: system
        types_or: [javascript, jsx, ts, tsx, json, css]
        exclude: ^(package\.json|\.github/|\.specify/)
        stages: [pre-commit]

      - id: commitlint
        name: Commitlint
        entry: pnpm exec commitlint --edit
        language: system
        stages: [commit-msg]
