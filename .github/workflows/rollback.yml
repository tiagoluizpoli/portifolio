name: Roll Back

# Redeploys an image that already exists in ghcr; nothing is built.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to roll back
        type: choice
        options: [development, production]
        required: true
      ref:
        description: Full commit SHA (or vX.Y.Z tag) of an existing image
        type: string
        required: true

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment == 'production' && vars.SITE_URL || 'https://portfolio-dev.lunalabs.duckdns.org' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: image
        env:
          REF: ${{ inputs.ref }}
        run: |
          [[ "$REF" =~ ^([0-9a-f]{40}|v[0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "ref must be a full SHA or vX.Y.Z"; exit 1; }
          echo "sha=$(git rev-parse "$REF^{commit}")" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/portfolio:$REF" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image must exist
        run: docker buildx imagetools inspect "${{ steps.image.outputs.image }}" > /dev/null
      - uses: ./.github/actions/dokploy-deploy
        with:
          image: ${{ steps.image.outputs.image }}
          sha: ${{ steps.image.outputs.sha }}
          url: ${{ inputs.environment == 'production' && vars.SITE_URL || 'https://portfolio-dev.lunalabs.duckdns.org' }}
          dokploy-url: ${{ vars.DOKPLOY_URL }}
          dokploy-api-key: ${{ secrets.DOKPLOY_API_KEY }}
          application-id: ${{ vars.DOKPLOY_APPLICATION_ID }}
          ts-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-secret: ${{ secrets.TS_OAUTH_SECRET }}
