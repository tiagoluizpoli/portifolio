repos:
  - repo: local
    hooks:
      - id: biome-check
        name: Biome Check
        entry: npx @biomejs/biome check --staged --files-ignore-unknown=true
        language: system
        types_or: [javascript, jsx, ts, tsx, json, css]
        stages: [pre-commit]

      - id: commitlint
        name: Commitlint
        entry: npx commitlint --edit
        language: system
        stages: [commit-msg]
