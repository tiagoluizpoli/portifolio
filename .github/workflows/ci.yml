name: CI
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

jobs:
  check:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  image:
    needs: check
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/portfolio:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.image }}
          build-args: GIT_SHA=${{ github.sha }}

  deploy:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One deploy per environment; a running one is never cancelled.
    concurrency:
      group: deploy-development
      cancel-in-progress: false
    environment:
      name: development
      url: https://portfolio-dev.lunalabs.duckdns.org
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dokploy-deploy
        with:
          image: ${{ needs.image.outputs.image }}
          sha: ${{ github.sha }}
          url: https://portfolio-dev.lunalabs.duckdns.org
          dokploy-url: ${{ vars.DOKPLOY_URL }}
          dokploy-api-key: ${{ secrets.DOKPLOY_API_KEY }}
          application-id: ${{ vars.DOKPLOY_APPLICATION_ID }}
          ts-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-secret: ${{ secrets.TS_OAUTH_SECRET }}

  # Release: a vX.Y.Z tag promotes the image already built for that commit; nothing is rebuilt.
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tagged commit must be in master
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/master || { echo "::error::$GITHUB_REF_NAME is not on master; nothing deployed"; exit 1; }
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: name
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/portfolio"
          docker buildx imagetools create -t "$repo:$GITHUB_REF_NAME" "$repo:$GITHUB_SHA"
          echo "image=$repo:$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/dokploy-deploy
        with:
          image: ${{ steps.name.outputs.image }}
          sha: ${{ github.sha }}
          url: ${{ vars.SITE_URL }}
          dokploy-url: ${{ vars.DOKPLOY_URL }}
          dokploy-api-key: ${{ secrets.DOKPLOY_API_KEY }}
          application-id: ${{ vars.DOKPLOY_APPLICATION_ID }}
          ts-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-secret: ${{ secrets.TS_OAUTH_SECRET }}
